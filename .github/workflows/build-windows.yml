name: SAMXTIX - Build Flutter Windows EXE
run-name: build ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      tag: { description: "Release tag containing Flutter project ZIP", required: true }
      request_id: { description: "Unique bot request ID", required: true }

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Download project ZIP
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force work | Out-Null
          Set-Location work
          gh release download $env:TAG --repo "${{ github.repository }}" --pattern "*.zip" --dir .
          $zip = Get-ChildItem *.zip | Select-Object -First 1
          if (-not $zip) { throw "ZIP project tidak ditemukan" }
          Expand-Archive -Path $zip.FullName -DestinationPath src -Force

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Flutter Windows
        shell: pwsh
        run: |
          Set-Location (Get-ChildItem work/src -Recurse -Filter pubspec.yaml | Select-Object -First 1).Directory.FullName
          flutter config --enable-windows-desktop
          if (-not (Test-Path windows)) { flutter create . --platforms=windows }
          flutter pub get

      - name: Build Windows
        shell: pwsh
        run: |
          Set-Location (Get-ChildItem work/src -Recurse -Filter pubspec.yaml | Select-Object -First 1).Directory.FullName
          flutter build windows --release

      - name: Package EXE
        shell: pwsh
        run: |
          $dir = (Get-ChildItem work/src -Recurse -Directory -Filter Release | Where-Object { $_.FullName -match 'build\\windows\\x64' } | Select-Object -First 1)
          if (-not $dir) { throw "Windows Release output tidak ditemukan" }
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path (Join-Path $dir.FullName '*') -DestinationPath out/SAMXTIX-Windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: out/SAMXTIX-Windows.zip
          retention-days: 1
