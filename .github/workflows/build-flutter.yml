name: Build Flutter / Android APK
run-name: build ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL zip project (info)"
        required: false
        type: string

      tag:
        description: "Tag release yang berisi ZIP project"
        required: true
        type: string

      build_type:
        description: "debug / release / release_genkey"
        required: false
        default: "release"
        type: string

      request_id:
        description: "ID unik dari bot"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, linux, x64, samxdex]
    timeout-minutes: 60

    env:
      TAG: ${{ inputs.tag }}
      BUILD_TYPE: ${{ inputs.build_type }}
      GH_TOKEN: ${{ github.token }}

    steps:

      # ==========================================
      # DOWNLOAD PROJECT ZIP
      # ==========================================
      - name: Download project ZIP
        shell: bash
        run: |
          set -e

          rm -rf work
          mkdir -p work
          cd work

          echo "Downloading release: $TAG"

          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "*.zip" \
            --dir .

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::ZIP project tidak ditemukan."
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"

          mkdir -p src
          unzip -q -o "$ZIP_FILE" -d src

          echo "Project berhasil diekstrak."

      # ==========================================
      # JAVA
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ==========================================
      # FLUTTER
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.6"
          cache: true

      # ==========================================
      # BUILD
      # ==========================================
      - name: Build Flutter / Android
        shell: bash
        run: |
          set -e

          cd work/src

          echo "=========================================="
          echo "Mencari project Flutter / Android"
          echo "=========================================="

          PUB=$(find . \
            -name pubspec.yaml \
            -not -path "*/.*" \
            -not -path "*/node_modules/*" \
            | head -1)

          if [ -n "$PUB" ]; then

            PROJECT_DIR="$(dirname "$PUB")"

            echo "Flutter project ditemukan:"
            echo "$PROJECT_DIR"

            cd "$PROJECT_DIR"

            # --------------------------------------
            # Generate Android jika belum ada
            # --------------------------------------
            if [ ! -d "android" ]; then
              echo "Android folder belum ada."
              echo "Generating Android platform..."

              flutter create . --platforms=android
            fi

            # --------------------------------------
            # FORCE GRADLE 8.14
            # --------------------------------------
            mkdir -p android/gradle/wrapper

            cat > android/gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-all.zip
          EOF

            echo "Gradle wrapper:"
            cat android/gradle/wrapper/gradle-wrapper.properties

            # --------------------------------------
            # Flutter dependencies
            # --------------------------------------
            flutter --version

            flutter pub get

            # --------------------------------------
            # BUILD
            # --------------------------------------
            if [ "$BUILD_TYPE" = "debug" ]; then

              echo "Building DEBUG APK..."

              flutter build apk --debug

            else

              echo "Building RELEASE APK..."

              flutter build apk --release

            fi

          else

            echo "Bukan Flutter project."
            echo "Mencari Gradle Android project..."

            GR=$(find . \
              -name gradlew \
              -not -path "*/.*" \
              | head -1)

            if [ -z "$GR" ]; then
              echo "::error::Project bukan Flutter/Android."
              echo "::error::pubspec.yaml dan gradlew tidak ditemukan."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$GR")"

            echo "Android project ditemukan:"
            echo "$PROJECT_DIR"

            cd "$PROJECT_DIR"

            chmod +x gradlew

            # --------------------------------------
            # FORCE GRADLE 8.14
            # --------------------------------------
            mkdir -p gradle/wrapper

            cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-all.zip
          EOF

            echo "Gradle wrapper:"
            cat gradle/wrapper/gradle-wrapper.properties

            # --------------------------------------
            # BUILD
            # --------------------------------------
            if [ "$BUILD_TYPE" = "debug" ]; then

              echo "Building Android DEBUG..."

              ./gradlew assembleDebug --no-daemon

            else

              echo "Building Android RELEASE..."

              ./gradlew assembleRelease --no-daemon

            fi

          fi

      # ==========================================
      # COLLECT APK
      # ==========================================
      - name: Collect APK
        shell: bash
        run: |
          set -e

          rm -rf out
          mkdir -p out

          echo "Mencari APK..."

          find work/src \
            -type f \
            -name "*.apk" \
            -path "*outputs*" \
            -exec cp {} out/ \;

          echo ""
          echo "APK hasil build:"
          ls -lah out

          if ! find out -type f -name "*.apk" | grep -q .; then
            echo "::error::APK tidak ditemukan."
            exit 1
          fi

      # ==========================================
      # SIGN APK
      # ==========================================
      - name: Sign APK
        if: env.BUILD_TYPE != 'debug'
        shell: bash
        run: |
          set -e

          echo "Signing APK..."

          BT=$(ls -d "$ANDROID_HOME"/build-tools/* \
            | sort -V \
            | tail -1)

          mkdir -p signing
          mkdir -p signed

          if [ "$BUILD_TYPE" = "release_genkey" ]; then

            ALIAS="samxdex"
            PASS=$(openssl rand -hex 10)

          else

            ALIAS="androiddebugkey"
            PASS="android"

          fi

          keytool -genkeypair \
            -keystore signing/release.jks \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname "CN=SAMXDEX BUILD, O=SAMXDEX, C=ID"

          for APK in out/*.apk; do

            NAME=$(basename "$APK")

            echo "Signing: $NAME"

            "$BT/zipalign" \
              -p \
              -f \
              4 \
              "$APK" \
              "signed/$NAME"

            "$BT/apksigner" sign \
              --ks signing/release.jks \
              --ks-key-alias "$ALIAS" \
              --ks-pass "pass:$PASS" \
              --key-pass "pass:$PASS" \
              "signed/$NAME"

            "$BT/apksigner" verify \
              "signed/$NAME"

          done

          rm -f out/*.apk
          cp signed/*.apk out/

          cat > signing/keystore-info.txt <<EOF
          Keystore : release.jks
          Alias    : $ALIAS
          StorePass: $PASS
          KeyPass  : $PASS
          EOF

          echo "APK berhasil ditandatangani."

      # ==========================================
      # UPLOAD APK ARTIFACT
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-build
          path: out/*.apk
          retention-days: 1

      # ==========================================
      # UPLOAD KEY
      # HANYA release_genkey
      # ==========================================
      - name: Upload signing key
        if: env.BUILD_TYPE == 'release_genkey'
        uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: |
            signing/release.jks
            signing/keystore-info.txt
          retention-days: 1
