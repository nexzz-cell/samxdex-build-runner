name: Build Flutter / Android APK
run-name: build ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL zip (info)"
        required: false

      tag:
        description: "Tag release berisi ZIP project"
        required: true

      build_type:
        description: "debug / release / release_genkey"
        required: false
        default: "release"

      request_id:
        description: "ID unik dari bot"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TAG: ${{ inputs.tag }}
      BUILD_TYPE: ${{ inputs.build_type }}
      GH_TOKEN: ${{ github.token }}

    steps:

      # ==========================================
      # DOWNLOAD PROJECT
      # ==========================================
      - name: Download project ZIP
        run: |
          set -e

          mkdir -p work
          cd work

          echo "Downloading release: $TAG"

          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "*.zip" \
            --dir .

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::ZIP project tidak ditemukan di release."
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"

          unzip -q -o "$ZIP_FILE" -d src

          echo "Project extracted:"
          find src -maxdepth 3 -type f | head -100


      # ==========================================
      # JAVA 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ==========================================
      # FLUTTER 3.47.6
      # ==========================================
      - name: Setup Flutter 3.47.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version
          echo "Gradle:"
          gradle --version || true


      # ==========================================
      # BUILD
      # ==========================================
      - name: Build
        shell: bash
        run: |
          set -e

          cd work/src

          PUB=$(find . \
            -name pubspec.yaml \
            -not -path "*/.*" \
            -not -path "*/node_modules/*" \
            | head -1)

          # ======================================
          # FLUTTER PROJECT
          # ======================================
          if [ -n "$PUB" ]; then

            PROJECT_DIR="$(dirname "$PUB")"

            echo "Flutter project detected:"
            echo "$PROJECT_DIR"

            cd "$PROJECT_DIR"

            # ------------------------------------
            # Create Android platform jika belum ada
            # ------------------------------------
            if [ ! -d android ]; then
              echo "Android folder tidak ditemukan."
              echo "Creating Android platform..."

              flutter create . --platforms=android
            fi

            # ------------------------------------
            # FORCE GRADLE 8.14 ALL
            # ------------------------------------
            echo "Forcing Gradle 8.14..."

            mkdir -p android/gradle/wrapper

            if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then

              sed -i \
                -E 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-all.zip#g' \
                android/gradle/wrapper/gradle-wrapper.properties

            else

              cat > android/gradle/wrapper/gradle-wrapper.properties <<'EOF'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-all.zip
EOF

            fi

            echo "Gradle wrapper:"
            cat android/gradle/wrapper/gradle-wrapper.properties

            # ------------------------------------
            # Flutter dependencies
            # ------------------------------------
            flutter pub get

            # ------------------------------------
            # Build APK
            # ------------------------------------
            if [ "$BUILD_TYPE" = "debug" ]; then

              flutter build apk --debug

            else

              flutter build apk --release

            fi


          # ======================================
          # ANDROID NATIVE PROJECT
          # ======================================
          else

            GR=$(find . \
              -name gradlew \
              -not -path "*/.*" \
              | head -1)

            if [ -z "$GR" ]; then
              echo "::error::Bukan project Flutter/Android."
              echo "pubspec.yaml / gradlew tidak ditemukan."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$GR")"

            echo "Android project detected:"
            echo "$PROJECT_DIR"

            cd "$PROJECT_DIR"

            chmod +x gradlew

            # ------------------------------------
            # FORCE GRADLE 8.14 ALL
            # ------------------------------------
            echo "Forcing Gradle 8.14..."

            mkdir -p gradle/wrapper

            if [ -f gradle/wrapper/gradle-wrapper.properties ]; then

              sed -i \
                -E 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-all.zip#g' \
                gradle/wrapper/gradle-wrapper.properties

            else

              cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-all.zip
EOF

            fi

            echo "Gradle wrapper:"
            cat gradle/wrapper/gradle-wrapper.properties

            # ------------------------------------
            # Verify wrapper
            # ------------------------------------
            ./gradlew --version

            # ------------------------------------
            # Build
            # ------------------------------------
            if [ "$BUILD_TYPE" = "debug" ]; then

              ./gradlew assembleDebug

            else

              ./gradlew assembleRelease

            fi

          fi


      # ==========================================
      # COLLECT APK
      # ==========================================
      - name: Collect APK
        shell: bash
        run: |
          set -e

          mkdir -p out

          find work/src \
            -type f \
            -name "*.apk" \
            -path "*outputs*" \
            -exec cp {} out/ \;

          echo "APK hasil build:"
          ls -lah out

          if [ -z "$(find out -type f -name "*.apk" -print -quit)" ]; then
            echo "::error::APK tidak ditemukan."
            exit 1
          fi


      # ==========================================
      # SIGN APK
      # ==========================================
      - name: Sign APK (release / release_genkey)
        if: env.BUILD_TYPE != 'debug'
        shell: bash
        run: |
          set -e

          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)

          mkdir -p signing signed

          if [ "$BUILD_TYPE" = "release_genkey" ]; then

            ALIAS=samxdex
            PASS=$(openssl rand -hex 10)

          else

            ALIAS=androiddebugkey
            PASS=android

          fi

          echo "Generating keystore..."

          keytool -genkeypair \
            -keystore signing/release.jks \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname "CN=SAMXDEX BUILD, O=SAMXDEX, C=ID"

          for f in out/*.apk; do

            NAME=$(basename "$f")

            "$BT/zipalign" \
              -p \
              -f \
              4 \
              "$f" \
              "signed/$NAME"

            "$BT/apksigner" sign \
              --ks signing/release.jks \
              --ks-key-alias "$ALIAS" \
              --ks-pass "pass:$PASS" \
              --key-pass "pass:$PASS" \
              "signed/$NAME"

            "$BT/apksigner" verify \
              "signed/$NAME"

          done

          rm -f out/*.apk

          cp signed/*.apk out/

          printf \
            'Keystore : release.jks\nAlias    : %s\nStorePass: %s\nKeyPass  : %s\n' \
            "$ALIAS" \
            "$PASS" \
            "$PASS" \
            > signing/keystore-info.txt


      # ==========================================
      # UPLOAD APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-build
          path: out/*.apk
          retention-days: 1


      # ==========================================
      # UPLOAD SIGNING KEY
      # ==========================================
      - name: Upload signing key (hanya release_genkey)
        if: env.BUILD_TYPE == 'release_genkey'
        uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: |
            signing/release.jks
            signing/keystore-info.txt
          retention-days: 1
