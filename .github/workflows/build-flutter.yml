name: Build Flutter / Android APK
run-name: build ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      zip_url:    { description: "URL zip (info)", required: false }
      tag:        { description: "Tag release berisi ZIP project", required: true }
      build_type: { description: "debug / release / release_genkey", required: false, default: "release" }
      request_id: { description: "ID unik dari bot", required: true }

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag }}
      BUILD_TYPE: ${{ inputs.build_type }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download project ZIP
        run: |
          mkdir -p work && cd work
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern "*.zip" --dir .
          unzip -q -o ./*.zip -d src
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Build
        run: |
          cd work/src
          PUB=$(find . -name pubspec.yaml -not -path "*/.*" -not -path "*/node_modules/*" | head -1)
          if [ -n "$PUB" ]; then
            cd "$(dirname "$PUB")"
            [ -d android ] || flutter create . --platforms=android
            flutter pub get
            if [ "$BUILD_TYPE" = "debug" ]; then flutter build apk --debug; else flutter build apk --release; fi
          else
            GR=$(find . -name gradlew | head -1)
            [ -n "$GR" ] || { echo "Error: bukan project Flutter/Android (pubspec.yaml / gradlew tidak ada)"; exit 1; }
            cd "$(dirname "$GR")"; chmod +x gradlew
            if [ "$BUILD_TYPE" = "debug" ]; then ./gradlew assembleDebug; else ./gradlew assembleRelease; fi
          fi
      - name: Collect APK
        run: |
          mkdir -p out
          find work/src -name "*.apk" -path "*outputs*" -exec cp {} out/ \;
          ls -la out; [ -n "$(ls out)" ] || { echo "Error: APK tidak ditemukan"; exit 1; }
      - name: Sign APK (release / release_genkey)
        if: env.BUILD_TYPE != 'debug'
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p signing signed
          if [ "$BUILD_TYPE" = "release_genkey" ]; then
            ALIAS=samxdex; PASS=$(openssl rand -hex 10)
          else
            ALIAS=androiddebugkey; PASS=android
          fi
          keytool -genkeypair -keystore signing/release.jks -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=SAMXDEX BUILD, O=SAMXDEX, C=ID"
          for f in out/*.apk; do
            "$BT/zipalign" -p -f 4 "$f" "signed/$(basename "$f")"
            "$BT/apksigner" sign --ks signing/release.jks --ks-key-alias "$ALIAS" \
              --ks-pass "pass:$PASS" --key-pass "pass:$PASS" "signed/$(basename "$f")"
            "$BT/apksigner" verify "signed/$(basename "$f")"
          done
          rm -f out/*.apk && cp signed/*.apk out/
          printf 'Keystore : release.jks\nAlias    : %s\nStorePass: %s\nKeyPass  : %s\n' "$ALIAS" "$PASS" "$PASS" > signing/keystore-info.txt
      - uses: actions/upload-artifact@v4
        with: { name: apk-build, path: out/*.apk, retention-days: 1 }
      - name: Upload signing key (hanya release_genkey)
        if: env.BUILD_TYPE == 'release_genkey'
        uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: |
            signing/release.jks
            signing/keystore-info.txt
          retention-days: 1
